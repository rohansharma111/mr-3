name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint and Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Prisma generation/typechecking must never connect to a real database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/mr3_ci?schema=public
      AUTH_SECRET: ci-only-not-a-real-secret
      AI_SUPPORT_ENABLED: "false"
      NEXT_PUBLIC_AI_SUPPORT_ENABLED: "false"
      OPENAI_API_KEY: ""
      OPENAI_MODEL: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Run ESLint
        run: npm run lint

      - name: Generate Prisma Client and typecheck
        run: npm run typecheck

      # Do not use `npm run build` here: that script runs `prisma migrate deploy`.
      # CI uses an isolated placeholder DATABASE_URL and must never apply migrations.
      - name: Run Next.js production build without migrations
        run: npx next build
